server {
    listen 80;
    server_name localhost;

    # Limite máximo de tamanho do corpo da requisição
    client_max_body_size 10M;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Frontend SPA (React / Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Reverso para o Backend Spring Boot (serviço 'server' no Docker Compose)
    location ~ ^/(auth|product|orders|payments|payment|api|swagger|v3/api-docs|actuator|admin|users|config) {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Conexões persistentes / WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Rota Crítica de Server-Sent Events (SSE) - Notificações em Tempo Real do Pix
    location ~ ^/payments/[^/]+/sse$ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRÍTICO: Desativa buffers para entrega imediata sem retenção de pacotes
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
